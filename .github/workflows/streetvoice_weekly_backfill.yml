name: Backfill StreetVoice Weekly Charts

on:
  workflow_dispatch: {}

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium
      - run: python streetvoice_realtime_scrape.py --mode weekly-backfill --max-targets 10
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ images/
          git diff --staged --quiet || git commit -m "StreetVoice weekly backfill batch $(date -u +%Y-%m-%d_%H%M)"
          git push
